name: Sync Backend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create HF Space repo structure
        run: |
          # Create a clean directory for the HF Space
          mkdir hf-space-tmp
          cd hf-space-tmp

          # Initialize git and FORCE branch name to main
          git init
          git checkout -b main  # <--- THIS IS THE FIX
          
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          # Copy only the server/ contents to the root
          cp -r ../server/* ./
          cp -r ../server/.* ./ 2>/dev/null || true

          # Ensure we have the required README with YAML header
          if [ ! -f README.md ]; then
            echo "---" > README.md
            echo "title: Viveka Backend" >> README.md
            echo "emoji: 🚀" >> README.md
            echo "colorFrom: blue" >> README.md
            echo "colorTo: purple" >> README.md
            echo "sdk: docker" >> README.md
            echo "app_port: 7860" >> README.md
            echo "---" >> README.md
            echo "" >> README.md
            echo "Backend for Viveka, powered by Docker." >> README.md
          fi

          # Check if Dockerfile exists
          if [ ! -f Dockerfile ]; then
            echo "Error: Dockerfile not found in server/!"
            exit 1
          fi

          # Add, commit, and push
          git add .
          git status
          git commit -m "Deploy backend from GitHub @ $(date)"

          # Now this command will find the 'main' branch successfully
          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/Anmol52490/viveka-backend main

      - name: Push to Hub
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: echo "Push done in previous step."
