name: Sync Backend to Hugging Face
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**' # Only run when server files change

jobs:
  sync-to-hub:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v3
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Python and Hugging Face Hub CLI
        run: |
          pip install huggingface_hub

      - name: Login to Hugging Face
        run: huggingface-cli login --token ${{ secrets.HF_TOKEN }}

      - name: Upload Server Directory to Space
        # This command uploads the local './server' folder to the root of the Space
        run: |
          huggingface-cli upload Anmol52490/viveka-backend ./server . \
            --repo-type space \
            --commit-message "Sync backend from GitHub Actions"
