name: Sync Backend to Hugging Face

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v3
        with:
          fetch-depth: 0

      - name: Create HF Space repo structure
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
          HF_USERNAME: ${{ secrets.HF_USERNAME }}
        run: |
          mkdir hf-space-tmp
          cd hf-space-tmp

          git init
          git checkout -b main
          git config user.name "GitHub Action"
          git config user.email "action@github.com"

          # Copy server contents
          cp -r ../server/* ./
          cp -r ../server/.* ./ 2>/dev/null || true

          # --- FIX: REMOVE LARGE PREPROCESSING FILES ---
          # This deletes the specific PDF or the whole preprocessing folder
          # so it doesn't get pushed to Hugging Face.
          rm -rf preprocessing
          # ---------------------------------------------

          # Create .dockerignore (Good practice)
          echo "__pycache__" > .dockerignore
          echo "*.pyc" >> .dockerignore
          echo ".git" >> .dockerignore
          echo ".github" >> .dockerignore
          echo "venv" >> .dockerignore
          
          # Ensure README exists
          if [ ! -f README.md ]; then
            echo "---" > README.md
            echo "title: Viveka Backend" >> README.md
            echo "emoji: 🚀" >> README.md
            echo "colorFrom: blue" >> README.md
            echo "colorTo: purple" >> README.md
            echo "sdk: docker" >> README.md
            echo "app_port: 7860" >> README.md
            echo "---" >> README.md
            echo "Backend for Viveka" >> README.md
          fi

          if [ ! -f Dockerfile ]; then
            echo "Error: Dockerfile not found in server/!"
            exit 1
          fi

          git add .
          git commit -m "Deploy backend from GitHub @ $(date)"

          git push --force https://$HF_USERNAME:$HF_TOKEN@huggingface.co/spaces/Anmol52490/viveka-backend main
