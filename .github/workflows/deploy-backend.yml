name: Sync Backend to Hugging Face
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'server/**' # Only run when server files change

jobs:
  deploy-to-space:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          lfs: true

      - name: Install Python & Hugging Face CLI
        run: |
          pip install --upgrade huggingface_hub

      - name: Login to Hugging Face
        run: huggingface-cli login --token ${{ secrets.HF_TOKEN }}

      - name: Deploy Server to Space
        env:
          HF_REPO_ID: 'Anmol52490/viveka-backend'
        run: |
          # 1. Upload the ./server directory to the root (.) of the Space
          # --repo-type space: Specifies we are uploading to a Space
          # --commit-message: Keeps your history clean
          
          huggingface-cli upload $HF_REPO_ID ./server . \
            --repo-type space \
            --commit-message "Sync backend from GitHub Actions: ${{ github.sha }}"
